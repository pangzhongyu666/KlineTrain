name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/klinetrain-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KLINETRAIN_KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KLINETRAIN_KEYSTORE_FILE: ${{ runner.temp }}/klinetrain-release.jks
          KLINETRAIN_KEYSTORE_PASSWORD: ${{ secrets.KLINETRAIN_KEYSTORE_PASSWORD }}
          KLINETRAIN_KEY_ALIAS: ${{ secrets.KLINETRAIN_KEY_ALIAS }}
          KLINETRAIN_KEY_PASSWORD: ${{ secrets.KLINETRAIN_KEY_PASSWORD }}

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/KlineTrain-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false

      - name: Upload APK artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: KlineTrain-release
          path: dist/*.apk
          retention-days: 30
